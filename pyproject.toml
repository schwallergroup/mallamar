[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mallamar"
version = "0.1.0"
readme = "README.md"
description = "Mallamar — autonomous chemistry with 6 BO, 3 BO + 3 LLM or 6 LLM experiment batches."
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
authors = [{name = "David Segura"}]
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.scripts]
mallamar = "agent_lg.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2"]

[tool.setuptools]
package-dir = {"" = ".", "agent_lg" = "agent_lg", "alice" = "vendor/alice/src/alice"}
license-files = ["LICENSE", "NOTICE", "vendor/alice/LICENSE"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = [".", "vendor/alice/src"]
include = ["agent_lg", "agent_lg.*", "alice", "alice.*"]
namespaces = true
exclude = ["agent_lg.perspective_study", "agent_lg.perspective_study.*"]

[tool.setuptools.package-data]
agent_lg = ["prompts/*.md", "configs/t5gemma_s_joint.yaml"]
alice = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100
